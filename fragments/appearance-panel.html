<aside class="appearance-panel">
    <p class="panel-label">Appearance</p>

    <section class="control-group">
        <p>Font Size</p>
        <div class="font-size-options">
            <label class="font-size-option">
                <input type="radio" name="font-size" value="small">
                <span>Small</span>
            </label>
            <label class="font-size-option">
                <input type="radio" name="font-size" value="standard" checked>
                <span>Standard</span>
            </label>
            <label class="font-size-option">
                <input type="radio" name="font-size" value="large">
                <span>Large</span>
            </label>
        </div>
    </section>

    <section class="control-group">
        <p>Color</p>
        <label class="option-row">
            <input type="radio" name="theme" value="dark" checked>
            <span>Dark mode</span>
        </label>
        <label class="option-row">
            <input type="radio" name="theme" value="light">
            <span>Light mode</span>
        </label>
    </section>
</aside>
